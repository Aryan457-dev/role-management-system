<!DOCTYPE html>
<html>
<head>
    <title>Update Role</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Update Role</h2>

    <form method="POST">
        <input class="form-control mb-3" type="text" name="name" value="{{ role.name }}" required>
        
        <textarea class="form-control mb-3" name="description">{{ role.description }}</textarea>
        
        <button class="btn btn-primary">Update</button>
    </form>

    <a href="/" class="btn btn-secondary mt-3">Back</a>
</div>

</body>
</html>
