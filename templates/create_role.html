<!DOCTYPE html>
<html>
<head>
    <title>Create Role</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Create Role</h2>

    <form method="POST">
        <input class="form-control mb-3" type="text" name="name" placeholder="Role Name" required>
        
        <textarea class="form-control mb-3" name="description" placeholder="Role Description"></textarea>
        
        <button class="btn btn-success">Create</button>
    </form>

    <a href="/" class="btn btn-secondary mt-3">Back</a>
</div>

</body>
</html>
